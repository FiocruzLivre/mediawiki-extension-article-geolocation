name: Verificar metadados e sintaxe da extensao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar JSON
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app --entrypoint php php:8.5-cli -r 'foreach (["extension.json", "composer.json"] as $f) { json_decode(file_get_contents("/app/".$f), true, 512, JSON_THROW_ON_ERROR); }'
      - name: Verificar sintaxe PHP
        shell: bash
        run: |
          if [ -d src ] || [ -d tests/phpunit ]; then
            find src tests/phpunit -type f -name '*.php' -print0 2>/dev/null | while IFS= read -r -d '' file; do
              docker run --rm -v "$PWD:/app:ro" -w /app --entrypoint php php:8.5-cli -l "/app/$file"
            done
          fi
