name: Testes PHP da geolocalização

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, dom, xml, mysqlnd, pdo_mysql, gd, zip, fileinfo
          coverage: none
          tools: composer:v2
      - name: Preparar MediaWiki 1.46.2
        run: |
          git clone --depth 1 --branch 1.46.2 https://gerrit.wikimedia.org/r/mediawiki/core.git "$RUNNER_TEMP/mediawiki"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mediawiki/extensions/ArticleGeolocation"
          cd "$RUNNER_TEMP/mediawiki"
          composer install --no-interaction --prefer-dist --no-progress
          cat > LocalSettings.php <<'PHP'
          <?php
          $wgSitename = 'Teste ArticleGeolocation';
          $wgServer = 'http://localhost';
          $wgScriptPath = '';
          $wgDBtype = 'mysql';
          $wgDBserver = '127.0.0.1';
          $wgDBname = 'nao_conectar';
          $wgDBuser = 'teste';
          $wgDBpassword = 'nao_utilizado';
          $wgSecretKey = str_repeat('0', 64);
          wfLoadExtension('ArticleGeolocation');
          PHP
      - name: Executar PHPUnit unitário pelo MediaWiki
        working-directory: ${{ runner.temp }}/mediawiki
        run: composer phpunit:entrypoint -- extensions/ArticleGeolocation/tests/phpunit/unit --colors=never
